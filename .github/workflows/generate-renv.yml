name: Generate R dependency lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-renv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - name: Install packages and generate lockfile
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          install.packages("renv")
          renv::init(bare = TRUE)
          renv::install(c("shiny", "capl", "readxl", "writexl", "ggplot2", "DT"))
          renv::snapshot(prompt = FALSE, force = TRUE)
          lock <- jsonlite::fromJSON("renv.lock", simplifyVector = FALSE)
          stopifnot(length(lock$Packages) > 0)
          stopifnot(all(vapply(lock$Packages, function(pkg) !is.null(pkg$Title) && !is.null(pkg$Description), logical(1))))
          stopifnot(file.exists("renv.lock"))
      - name: Commit dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add renv.lock .Rprofile renv/activate.R renv/settings.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate reproducible R dependencies"
            git push
          fi
