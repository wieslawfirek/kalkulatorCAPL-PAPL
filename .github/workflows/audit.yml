name: Audit CAPL-2 and PAPL scoring
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - name: Install reproducible R dependencies
        shell: Rscript {0}
        run: |
          install.packages("renv")
          renv::restore(prompt = FALSE)
      - name: Compare calculator with capl and test PAPL thresholds
        shell: Rscript {0}
        run: |
          source("tests/audit.R")
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capl-papl-audit
          path: audit-results.csv
          if-no-files-found: warn
