name: Generate Posit manifest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - name: Generate deployment manifest from renv.lock
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          install.packages(c("rsconnect", "renv"))
          rsconnect::writeManifest(appDir = ".")
          stopifnot(file.exists("manifest.json"))
          manifest <- jsonlite::fromJSON("manifest.json", simplifyVector = FALSE)
          stopifnot(is.list(manifest), length(manifest) > 0)
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate Posit Connect Cloud manifest"
            git push
          fi
